name: 公开发布已验收版本
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 已完成镜像与安装验收的完整版本标签
        type: string
        required: true
        default: v2.2.2
permissions:
  contents: read
concurrency:
  group: publish-latest
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 校验完整版本号
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - name: 使用当前发布规则检查 Latest 升级方向
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { validateLatestPromotion } from './scripts/release-publication.mjs';
          const { GITHUB_REPOSITORY: repository, RELEASE_TAG: tag } = process.env;
          const get = path => JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${path}`], { encoding: 'utf8' }));
          const release = JSON.parse(execFileSync('gh', ['release', 'view', tag, '--repo', repository, '--json', 'tagName,isDraft,isPrerelease'], { encoding: 'utf8' }));
          const latest = get('releases/latest');
          assert.equal(release.tagName, tag);
          assert.equal(release.isPrerelease, false);
          validateLatestPromotion({ tag, latestTag: latest.tag_name, draft: release.isDraft });
          console.log(`Validated ${tag} against Latest ${latest.tag_name}.`);
          NODE
      - name: 保留已核对的发布工具
        run: |
          mkdir -p "$RUNNER_TEMP/nxopa-publisher"
          cp scripts/publish-release.mjs scripts/release-publication.mjs scripts/release-images.mjs "$RUNNER_TEMP/nxopa-publisher/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p .runtime/reports
      - name: 核对附件与公开镜像，再更新 Latest
        run: node "$RUNNER_TEMP/nxopa-publisher/publish-release.mjs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-report
          path: |
            .runtime/reports/publication.json
            .runtime/reports/published-images.json
