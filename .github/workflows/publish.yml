name: 公开发布 v0.10.0 并下架 V1.0.0
on:
  workflow_dispatch:
    inputs:
      retire_v1:
        description: 发布并验证 v0.10.0 后清理已弃用的 V1.0.0
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: publish-v0.10.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: v0.10.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v0.10.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.12.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p .runtime/reports
      - name: 核对附件与公开镜像，再更新 Latest
        run: node scripts/publish-release.mjs
      - name: 清点旧镜像及所有保留引用
        if: ${{ inputs.retire_v1 }}
        run: node scripts/retire-v1.mjs prepare .runtime/retire-v1-inventory.json
      - name: 保留删除前的精确清单
        if: ${{ inputs.retire_v1 && success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retire-v1-inventory
          path: .runtime/retire-v1-inventory.json
          retention-days: 90
      - name: 按清单清理 V1.0.0 专属镜像、Release 与标签
        if: ${{ inputs.retire_v1 && success() }}
        run: node scripts/retire-v1.mjs execute .runtime/retire-v1-inventory.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: publication-report
          path: |
            .runtime/reports/publication.json
            .runtime/reports/retired-v1.json
            .runtime/reports/published-images.json
