name: 跨架构镜像安装验收

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 待验收的已有镜像版本
        required: true
        default: v0.9.2
        type: string
      proxy_only:
        description: 仅复验 HTTPS 代理与迁移流程
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  installation:
    name: 安装与备份恢复 / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
      - name: 准备依赖与浏览器
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          if [[ '${{ inputs.proxy_only }}' != true ]]; then
            pnpm exec playwright install --with-deps chromium
          fi
      - name: 使用公开镜像验证安装、PDF 和备份恢复
        if: ${{ !inputs.proxy_only }}
        env:
          INSTALL_TEST_MODE: images
          IMAGE_TAG: ${{ inputs.image_tag }}
          INSTALL_UPGRADE_FROM: v0.1.1
        run: pnpm test:install
      - name: 交互安装、升级及卸载实际验收
        if: ${{ !inputs.proxy_only }}
        env:
          INTERACTIVE_INSTALL_FROM: v0.1.5
          INTERACTIVE_INSTALL_TO: ${{ inputs.image_tag }}
        run: pnpm test:install-interactive
      - name: 核验匿名拉取及镜像版本
        if: ${{ !inputs.proxy_only }}
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: node scripts/verify-published-images.mjs "$IMAGE_TAG"
      - name: HTTPS 双层代理与旧部署切换验收
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: pnpm test:install-proxy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installation-${{ matrix.arch }}
          path: |
            .runtime/reports/install.json
            .runtime/reports/install-interactive.json
            .runtime/reports/install-proxy.json
          retention-days: 30
