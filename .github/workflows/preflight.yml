name: 发布前完整预检

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: 干净 Linux 环境完整回归
    runs-on: ubuntu-24.04
    env:
      PLATFORM_TEST_LATEX_IMAGE: nxopa-latex-test:current
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
      - name: 安装锁定依赖与生成 Prisma 客户端
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          DATABASE_URL=postgresql://build:build@localhost:5432/build pnpm db:generate
      - name: 工程、安装引导与完整业务验收
        run: |
          pnpm audit:runtime
          pnpm typecheck
          pnpm format:check
          pnpm test
          pnpm test:install-cli
          pnpm test:install-images
          pnpm test:backup-security
          pnpm test:web-static
          pnpm test:install-bootstrap
          pnpm test:install-gateway
          pnpm exec playwright install --with-deps chromium
          pnpm test:release-features
          docker build -t nxopa-minio-test:current infra/minio
          docker build -t nxopa-latex-test:current infra/latex-runner
          pnpm test:platform-features
          pnpm test:full
          pnpm docs:build
          pnpm docs:verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-preflight-report
          path: |
            .runtime/reports/release-features.json
            .runtime/reports/platform-features.json
            .runtime/reports/full-regression.json
            .runtime/reports/ui-audit
          retention-days: 14
