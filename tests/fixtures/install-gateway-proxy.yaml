# Acceptance-only outer proxy. It can reach Caddy, but cannot bypass it to reach the API.
services:
  acceptance-proxy:
    image: nginx:1.28.0-alpine
    ports:
      - '127.0.0.1:${TEST_PROXY_PORT:?test port required}:80'
    volumes:
      - ../tests/fixtures/install-gateway-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/api/v1/health']
      interval: 2s
      timeout: 5s
      retries: 30
