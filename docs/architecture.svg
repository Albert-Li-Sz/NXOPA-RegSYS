<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-labelledby="title desc">
<title id="title">竞赛报名中心系统结构图</title>
<desc id="desc">用户与只读 MCP 通过官网和统一 API 访问报名系统。API 使用 PostgreSQL、Redis 和私有文件卷；Worker 完成评测平台、邮件和隔离 LaTeX 编译任务。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7890ae"/></marker></defs>
<rect width="1500" height="1500" fill="#f6f8fc"/>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}.heading{font-size:29px;font-weight:650;fill:#20344e}.sub{font-size:18px;fill:#697b91}.label{font-size:21px;font-weight:600;fill:#304b6f}.body{font-size:18px;fill:#506b8b}.small{font-size:16px;fill:#667c95}.edge{fill:none;stroke:#7890ae;stroke-width:2.3;marker-end:url(#arrow);stroke-linejoin:round}.tag{font-size:15px;fill:#5d7592}</style>

<text x="64" y="66" class="heading" text-anchor="start">竞赛报名中心系统结构图</text>
<text x="64" y="104" class="sub" text-anchor="start">单站点多竞赛 · Vue 3 + NestJS · Docker 自托管</text>
<rect x="64" y="152" width="800" height="88" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="88" y="187" class="label" text-anchor="start">官网与后台访问者</text>
<text x="88" y="218" class="body" text-anchor="start">参赛者  /  指导老师  /  竞赛管理员  /  系统管理员</text>
<rect x="936" y="152" width="500" height="88" rx="12" fill="#edf5ff" stroke="#bdd7fa"/>
<text x="960" y="187" class="label" text-anchor="start">只读 MCP 适配器</text>
<text x="960" y="218" class="body" text-anchor="start">授权查询 API；后期机器人复用接口</text>
<rect x="64" y="288" width="800" height="94" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="88" y="324" class="label" text-anchor="start">Caddy HTTPS 入口</text>
<text x="88" y="354" class="body" text-anchor="start">Vue 3 官网与管理后台 · API 同域代理</text>
<rect x="936" y="288" width="500" height="94" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="960" y="324" class="label" text-anchor="start">第三方身份服务</text>
<text x="960" y="354" class="body" text-anchor="start">通用 OAuth2 / OIDC · 登录与账号绑定</text>
<rect x="64" y="446" width="800" height="280" rx="12" fill="#fff" stroke="#bdd7fa"/>
<text x="88" y="487" class="label" text-anchor="start">NestJS API 统一业务与权限</text>
<text x="88" y="518" class="small" text-anchor="start">网页、老师代办、联合注册与自动化使用同一套业务规则</text>
<rect x="88" y="540" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="205" y="567" class="body" text-anchor="middle">账号与身份</text>
<rect x="338" y="540" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="455" y="567" class="body" text-anchor="middle">竞赛与公告</text>
<rect x="588" y="540" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="705" y="567" class="body" text-anchor="middle">全局字段与表单</text>
<rect x="88" y="593" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="205" y="620" class="body" text-anchor="middle">个人与团队报名</text>
<rect x="338" y="593" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="455" y="620" class="body" text-anchor="middle">指导老师与审核</text>
<rect x="588" y="593" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="705" y="620" class="body" text-anchor="middle">线下财务与账簿</text>
<rect x="88" y="646" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="205" y="673" class="body" text-anchor="middle">工单与准考证</text>
<rect x="338" y="646" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="455" y="673" class="body" text-anchor="middle">平台与开放 API</text>
<rect x="588" y="646" width="234" height="41" rx="7" fill="#f1f6fc" stroke="#e4ecf6"/>
<text x="705" y="673" class="body" text-anchor="middle">文件、审计与事件</text>
<rect x="936" y="446" width="500" height="110" rx="12" fill="#edf5ff" stroke="#bdd7fa"/>
<text x="960" y="484" class="label" text-anchor="start">Worker 异步任务</text>
<text x="960" y="515" class="body" text-anchor="start">平台同步 · 邮件 · PDF · 批量导出</text>
<text x="960" y="540" class="small" text-anchor="start">逐步记录结果，支持去重、重试与读回验证</text>
<rect x="936" y="632" width="500" height="244" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="960" y="672" class="label" text-anchor="start">平台与邮件服务</text>
<text x="960" y="703" class="body" text-anchor="start">Hydro 桥接插件</text>
<text x="960" y="723" class="tag" text-anchor="start">创建比赛账号，加入域与比赛</text>
<text x="960" y="747" class="body" text-anchor="start">DOMjudge 版本化 API</text>
<text x="960" y="767" class="tag" text-anchor="start">创建队伍与用户，确认目标竞赛资格</text>
<text x="960" y="791" class="body" text-anchor="start">后续竞赛平台</text>
<text x="960" y="811" class="tag" text-anchor="start">联合注册协议与 Connector 扩展</text>
<text x="960" y="835" class="body" text-anchor="start">SMTP 邮箱服务</text>
<text x="960" y="855" class="tag" text-anchor="start">验证邮件、审核与工单通知</text>
<rect x="64" y="802" width="250" height="130" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="84" y="839" class="label" text-anchor="start">PostgreSQL</text>
<text x="84" y="870" class="body" text-anchor="start">报名、财务与权限</text>
<text x="84" y="897" class="body" text-anchor="start">配置快照与 Outbox</text>
<rect x="339" y="802" width="250" height="130" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="359" y="839" class="label" text-anchor="start">Redis + BullMQ</text>
<text x="359" y="870" class="body" text-anchor="start">会话与任务队列</text>
<text x="359" y="897" class="body" text-anchor="start">数据库事件可恢复</text>
<rect x="614" y="802" width="250" height="130" rx="12" fill="#fff" stroke="#dce5f1"/>
<text x="634" y="839" class="label" text-anchor="start">私有文件卷</text>
<text x="634" y="870" class="body" text-anchor="start">附件、凭证与 PDF</text>
<text x="634" y="897" class="body" text-anchor="start">统一授权后下载</text>
<rect x="64" y="1005" width="1372" height="110" rx="12" fill="#edf5ff" stroke="#bdd7fa"/>
<text x="88" y="1041" class="label" text-anchor="start">独立 LaTeX 编译环境</text>
<text x="88" y="1074" class="body" text-anchor="start">Worker 仅投递当前任务的资料与素材</text>
<rect x="527" y="1028" width="259" height="63" rx="8" fill="#fff" stroke="#cadcf2"/>
<text x="656.5" y="1066" class="label" text-anchor="middle">专用任务卷</text>
<rect x="842" y="1028" width="564" height="63" rx="8" fill="#fff" stroke="#cadcf2"/>
<text x="867" y="1054" class="body" text-anchor="start">XeLaTeX Runner · 每任务文件沙箱</text>
<text x="867" y="1078" class="small" text-anchor="start">无网络，禁用 shell escape，无数据库或生产附件访问</text>
