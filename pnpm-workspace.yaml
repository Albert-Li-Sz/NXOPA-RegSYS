packages:
  - apps/*
  - packages/*
  - plugins/*
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@vue/language-core@3.3.13'
  - vue-tsc@3.3.13
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true
  msgpackr-extract: true
  '@scarf/scarf': false

overrides:
  'ip-address@>=10.0.0 <10.7.4': '10.7.4'
  'js-yaml@>=5.0.0 <5.4.3': '5.4.3'
  'deepmerge-ts@<8.0.0': '8.0.2'
  'mysql2@<3.24.6': '3.24.6'

  'uuid@<11.1.1': '11.1.1'
  'body-parser@<2.4.0': '2.4.0'
  'multer@<2.5.0': '2.5.0'
  'fast-uri@<3.1.9': '3.1.9'
