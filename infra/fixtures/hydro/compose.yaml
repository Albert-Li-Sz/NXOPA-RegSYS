name: contest-center-hydro-fixture
services:
  mongo:
    image: mongo:7.0.16
    volumes: [hydro_mongo:/data/db]
    mem_limit: 600m
  hydro:
    build:
      context: ../../..
      dockerfile: infra/fixtures/hydro/Dockerfile
    environment:
      CONTEST_CENTER_TOKEN: local-fixture-token-32characters-for-testing-only
      CONTEST_CENTER_DOMAINS: system
      NODE_APP_INSTANCE: '0'
    ports: [127.0.0.1:58888:8888]
    depends_on: [mongo]
    volumes: [hydro_home:/root/.hydro]
    mem_limit: 1300m
volumes:
  hydro_mongo:
  hydro_home:
