name: contest-center-domjudge-fixture
services:
  mariadb:
    image: mariadb:10.11.11
    environment:
      MARIADB_ROOT_PASSWORD: fixture-root-password
      MARIADB_DATABASE: domjudge
      MARIADB_USER: domjudge
      MARIADB_PASSWORD: fixture-database-password
    volumes: [domjudge_database:/var/lib/mysql]
    command: [--max-connections=80]
    mem_limit: 450m
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      retries: 20
  domserver:
    image: contest-center-domjudge:9.0.1
    environment:
      MYSQL_HOST: mariadb
      MYSQL_USER: domjudge
      MYSQL_DATABASE: domjudge
      MYSQL_PASSWORD: fixture-database-password
      MYSQL_ROOT_PASSWORD: fixture-root-password
      DJ_DB_INSTALL_BARE: '1'
      WEBAPP_BASEURL: /
      CONTAINER_TIMEZONE: Asia/Shanghai
      FPM_MAX_CHILDREN: '4'
      FPM_MEMORY_LIMIT: 256M
    ports: [127.0.0.1:58901:80]
    depends_on:
      mariadb: { condition: service_healthy }
    volumes: [domjudge_config:/opt/domjudge/domserver/etc]
    mem_limit: 1100m
volumes:
  domjudge_database:
  domjudge_config:
