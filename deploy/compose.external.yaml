# Explicit compatibility mode for an existing host reverse proxy with two upstreams.
services:
  api:
    ports:
      - target: 3000
        published: '${API_PORT:-3000}'
        host_ip: '${API_BIND_ADDRESS:-127.0.0.1}'
    environment:
      # Docker host forwarding normally has a bridge peer address. It is deliberately
      # untrusted by default; PUBLIC_URL supplies the canonical HTTPS scheme.
      API_TRUSTED_PROXY_CIDRS: '${API_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}'
