# With Compose >= 2.24.4, merge after compose.yaml to install published images.
services:
  initialize:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/albert-li-sz/nxopa-regsys}-api:${IMAGE_TAG:-v0.1.4}
  api:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/albert-li-sz/nxopa-regsys}-api:${IMAGE_TAG:-v0.1.4}
  worker:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/albert-li-sz/nxopa-regsys}-worker:${IMAGE_TAG:-v0.1.4}
  web:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/albert-li-sz/nxopa-regsys}-web:${IMAGE_TAG:-v0.1.4}
  latex:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/albert-li-sz/nxopa-regsys}-latex:${IMAGE_TAG:-v0.1.4}
